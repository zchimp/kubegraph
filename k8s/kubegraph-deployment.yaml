apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubegraph-app
  namespace: kubegraph
  labels:
    app: kubegraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubegraph
  template:
    metadata:
      labels:
        app: kubegraph
    spec:
      # =========镜像拉取凭证配置=========
      imagePullSecrets:
        - name: acr-secret
      # =================================
      containers:
      - name: kubegraph
        image: registry.cn-hangzhou.aliyuncs.com/zchimp/kubegraph:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10